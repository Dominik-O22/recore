# The tools that build the corpora, on top of mise.toml's. Loaded only when MISE_ENV=corpus, so a
# plain `mise install`, as the release workflow runs it, does not fetch them:
#   MISE_ENV=corpus mise install
#   MISE_ENV=corpus mise run corpus
#
# Not from mise: clang, which builds half of the Cortex-M corpus, is the system's, and SDCC, which
# builds the 8051 corpus, is a system package. corpus/build_pe.py downloads its own llvm-mingw.

[tools]
# The Arm GNU Toolchain: GCC, GNU ld, binutils, libgcc and newlib for every Cortex-M core.
# corpus/build_thumb.py finds it with `mise where`.
gcc-arm-none-eabi = "13.3"
python = "3.13"
# For Ghidra, which the reference runs need.
java = "25"

[tasks.corpus]
description = "Build the 8051 and Cortex-M corpora from their pinned sources"
run = ["python3 corpus/build_8051.py", "python3 corpus/build_thumb.py"]
