name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98 # mise.toml pins the same, so a new release adds no lints by surprise
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The decompiler engine and the Swift demangler are C++; the second builds with cmake.
      - run: cmake --version && c++ --version
      - run: cargo clippy --profile tests --workspace --all-targets -- -D warnings
      - run: cargo test --profile tests --workspace
