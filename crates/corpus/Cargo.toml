[package]
name = "recore-corpus"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
cpp_demangle = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
gimli = "0.34.0"
iced-x86 = "1.21.0"
object = { version = "0.40.0", features = ["compression"] }
pdb2 = "0.10.2"
rayon = "1.12.0"
recore = { version = "0.2.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
yaxpeax-arch = "0.3.2"
yaxpeax-arm = "0.5.0"

[dev-dependencies]
object = { version = "0.40.0", features = ["write"] }
