[package]
name = "recore-decomp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ghidra-decompiler-sys = { version = "0.1.0", path = "../../third_party/ghidra-decompiler" }
gimli = "0.34.0"
libc = "0.2"
mimalloc = "0.1"
pdb2 = "0.10.2"
object = { version = "0.40.0", features = ["compression"] }
recore = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
cc = "1.2"
